name: Feature request
description: Propose a focused improvement that fits Quartz's local-first direction.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap should Quartz solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest coherent solution and its macOS interaction model.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: data
    attributes:
      label: Data or privacy impact
      options:
        - None
        - Local persistence change
        - File-system access change
        - Network or sync change
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: The proposal preserves a useful local-first workflow.
          required: true
        - label: I searched the roadmap, issues, and pull requests.
          required: true
